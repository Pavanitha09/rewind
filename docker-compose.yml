services:
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: rewind-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: rewind-postgres
    environment:
      POSTGRES_USER: rewind
      POSTGRES_PASSWORD: rewind
      POSTGRES_DB: rewind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Benchmark only (Module 8/10): the Temporal dev server, a baseline we compare against.
  # Start with:  docker compose --profile bench up -d
  temporal:
    image: temporalio/temporal:1.9.1
    container_name: rewind-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports:
      - "127.0.0.1:7233:7233"
    profiles: ["bench"]

volumes:
  pgdata:

